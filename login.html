<!DOCTYPE html>
<html>
<head>
  <title>Login - Atlas Interactive</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family: Consolas, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #161b22;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px #58a6ff;
      width: 350px;
      text-align: center;
    }

    .login-box h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: #58a6ff;
      margin-bottom: 20px;
      text-shadow: 0 0 8px #58a6ff;
    }

    .login-box input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #58a6ff;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      font-weight: bold;
      font-family: Consolas, monospace;
    }

    .login-box input:focus {
      outline: none;
      border-color: #ffba08;
      box-shadow: 0 0 8px #ffba08;
    }

    .login-box button {
      width: 95%;
      padding: 12px;
      margin-top: 15px;
      background: #58a6ff;
      color: #0d1117;
      border: none;
      border-radius: 8px;
      font-weight: bolder;
      cursor: pointer;
      font-family: Consolas, monospace;
    }

    .login-box button:hover {
      background: #0d1117;
      color: #58a6ff;
      border: 2px solid #58a6ff;
    }

    .login-box p {
      margin-top: 15px;
      font-size: 14px;
      color: #9ecbff;
    }

    .login-box a {
      color: #ffba08;
      text-decoration: none;
      font-weight: bold;
    }

    .login-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Login</h1>
    <form method="POST" action="login.php">
      <input type="text" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>

</body>
</html>
